# 近期书单数据：content/posts/reading-list.md 通过 book-grid 短代码按分组渲染。
# status 取值：read（已阅读）/ unread（未开始）。
# cover 为 static/images/reading-list/ 下的文件名，缺省时渲染书脊占位。
# douban 为豆瓣读书条目 id，封面与版本信息均取自该条目。

