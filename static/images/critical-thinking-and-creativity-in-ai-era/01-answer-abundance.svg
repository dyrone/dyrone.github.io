<svg viewBox="0 0 1200 630" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
  <title id="t">答案过剩，判断与创造成为稀缺能力</title>
  <desc id="d">大量 AI 答案经过问题、证据、价值与责任四道由人把守的关口，说明生成答案不等于解决问题。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2F2B26"/></marker></defs>
  <rect width="1200" height="630" fill="#FFFDF7"/><rect x="28" y="28" width="1144" height="574" rx="20" fill="#F7F0DE" stroke="#2F2B26" stroke-width="3"/>
  <text x="70" y="92" font-family="sans-serif" font-size="38" font-weight="700" fill="#2F2B26">答案变多以后，什么变得稀缺？</text>
  <path d="M78 113H650" stroke="#F2C94C" stroke-width="15" opacity=".75"/>
  <g font-family="sans-serif" font-size="24" fill="#2F2B26">
    <g transform="rotate(-4 170 210)"><rect x="80" y="155" width="215" height="105" rx="10" fill="#FFFDF7" stroke="#746B60" stroke-width="2"/><text x="105" y="198">AI 答案 01</text><path d="M105 218H260M105 236H225" stroke="#746B60" stroke-width="5"/></g>
    <g transform="rotate(3 200 330)"><rect x="105" y="275" width="215" height="105" rx="10" fill="#FFFDF7" stroke="#746B60" stroke-width="2"/><text x="130" y="318">AI 答案 02</text><path d="M130 338H285M130 356H245" stroke="#746B60" stroke-width="5"/></g>
    <g transform="rotate(-2 180 450)"><rect x="75" y="395" width="215" height="105" rx="10" fill="#FFFDF7" stroke="#746B60" stroke-width="2"/><text x="100" y="438">AI 答案 03</text><path d="M100 458H255M100 476H220" stroke="#746B60" stroke-width="5"/></g>
  </g>
  <path d="M325 330H430" stroke="#2F2B26" stroke-width="4" marker-end="url(#a)"/>
  <path d="M430 170L700 235V425L430 490Z" fill="#FFFDF7" stroke="#2F2B26" stroke-width="3"/>
  <g font-family="sans-serif" font-size="25" font-weight="700" fill="#2F2B26">
    <rect x="458" y="209" width="190" height="48" rx="24" fill="#F2C94C"/><text x="493" y="242">问题对吗？</text>
    <rect x="478" y="277" width="190" height="48" rx="24" fill="#FFFDF7" stroke="#B5483F" stroke-width="3"/><text x="511" y="310">证据真吗？</text>
    <rect x="478" y="345" width="190" height="48" rx="24" fill="#FFFDF7" stroke="#B5483F" stroke-width="3"/><text x="511" y="378">价值何在？</text>
    <rect x="458" y="413" width="190" height="48" rx="24" fill="#F2C94C"/><text x="493" y="446">谁来负责？</text>
  </g>
  <path d="M705 330H810" stroke="#2F2B26" stroke-width="4" marker-end="url(#a)"/>
  <rect x="825" y="205" width="285" height="250" rx="22" fill="#FFFDF7" stroke="#2F2B26" stroke-width="4"/>
  <text x="968" y="265" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#746B60">最终产物</text>
  <text x="968" y="330" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="#2F2B26">可承担的</text><text x="968" y="382" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="#2F2B26">解决方案</text>
  <path d="M872 409H1064" stroke="#F2C94C" stroke-width="18" opacity=".8"/>
  <text x="828" y="530" font-family="sans-serif" font-size="25" font-weight="700" fill="#B5483F" transform="rotate(-3 828 530)">生成不是终点，判断才是瓶颈。</text>
</svg>