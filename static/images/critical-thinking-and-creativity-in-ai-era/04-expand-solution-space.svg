<svg viewBox="0 0 1200 630" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
  <title id="t">创造力扩大解空间</title><desc id="d">来自技术、艺术、自然和商业的素材经过组合、酝酿和原型，形成多个机制不同的方案。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2F2B26"/></marker></defs>
  <rect width="1200" height="630" fill="#FFFDF7"/><rect x="28" y="28" width="1144" height="574" rx="20" fill="#F7F0DE" stroke="#2F2B26" stroke-width="3"/>
  <text x="70" y="90" font-family="sans-serif" font-size="38" font-weight="700" fill="#2F2B26">创造力不是等灵感，而是扩大解空间</text><path d="M68 112H700" stroke="#F2C94C" stroke-width="15"/>
  <g font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <g transform="rotate(-5 145 218)"><rect x="72" y="170" width="150" height="96" rx="12" fill="#FFFDF7" stroke="#746B60" stroke-width="3"/><text x="147" y="228" fill="#2F2B26">技术</text></g>
    <g transform="rotate(4 240 350)"><rect x="165" y="300" width="150" height="96" rx="12" fill="#FFFDF7" stroke="#746B60" stroke-width="3"/><text x="240" y="358" fill="#2F2B26">艺术</text></g>
    <g transform="rotate(-3 135 475)"><rect x="60" y="425" width="150" height="96" rx="12" fill="#FFFDF7" stroke="#746B60" stroke-width="3"/><text x="135" y="483" fill="#2F2B26">自然</text></g>
    <g transform="rotate(5 305 490)"><rect x="230" y="440" width="150" height="96" rx="12" fill="#FFFDF7" stroke="#746B60" stroke-width="3"/><text x="305" y="498" fill="#2F2B26">商业</text></g>
  </g>
  <path d="M350 340H440" stroke="#2F2B26" stroke-width="4" marker-end="url(#a)"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#2F2B26">
    <circle cx="540" cy="340" r="92" fill="#F2C94C" stroke="#2F2B26" stroke-width="4"/><text x="540" y="330" font-size="30" font-weight="700">连接</text><text x="540" y="370" font-size="24">旧元素，新组合</text>
    <path d="M615 285C690 210 740 220 790 245M630 340H790M615 395C690 470 740 460 790 435" fill="none" stroke="#2F2B26" stroke-width="4" marker-end="url(#a)"/>
    <g font-size="25" font-weight="700">
      <rect x="815" y="175" width="280" height="105" rx="16" fill="#FFFDF7" stroke="#B5483F" stroke-width="3"/><text x="955" y="220">方案 A：换机制</text><text x="955" y="254" font-size="20" fill="#746B60">从自然系统借结构</text>
      <rect x="815" y="290" width="280" height="105" rx="16" fill="#FFFDF7" stroke="#B5483F" stroke-width="3"/><text x="955" y="335">方案 B：换约束</text><text x="955" y="369" font-size="20" fill="#746B60">预算只剩十分之一</text>
      <rect x="815" y="405" width="280" height="105" rx="16" fill="#FFFDF7" stroke="#B5483F" stroke-width="3"/><text x="955" y="450">方案 C：做原型</text><text x="955" y="484" font-size="20" fill="#746B60">让现实尽早回答</text>
    </g>
  </g>
  <text x="430" y="555" font-family="sans-serif" font-size="25" font-weight="700" fill="#B5483F" transform="rotate(-2 430 555)">先发散，后评判；先做出来，再争论。</text>
</svg>