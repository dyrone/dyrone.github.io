<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t2 d2">
  <title id="t2">Jev 与 System One 的区别：具体模型与模型类别</title>
  <desc id="d2">左侧一个大圈表示 System One 模型这一类别，圈内高亮的 Jev 只是其中之一，旁边还有其他团队的同类模型；右侧对比常见 LLM 逐 token 生成字符串，与 System One 模型一次查询并行输出带概率的结构化值。</desc>

  <rect width="1200" height="630" fill="#fffdf7"/>
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>
  <defs>
    <marker id="inkArrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#282722"/>
    </marker>
  </defs>

  <text x="600" y="62" font-family="sans-serif" font-size="26" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-2, 600, 62)">类别 ≠ 具体模型</text>

  <!-- LEFT: the class contains Jev and others -->
  <ellipse cx="300" cy="320" rx="245" ry="190" fill="#f7f0de" stroke="#282722" stroke-width="2.5" stroke-dasharray="10,6"/>
  <text x="300" y="180" font-family="sans-serif" font-size="22" font-weight="bold" fill="#282722" text-anchor="middle">System One 模型（一类）</text>
  <circle cx="220" cy="300" r="72" fill="#efd15b" opacity="0.6" stroke="#282722" stroke-width="2.5"/>
  <text x="220" y="300" font-family="sans-serif" font-size="32" font-weight="bold" fill="#282722" text-anchor="middle">Jev</text>
  <text x="220" y="328" font-family="sans-serif" font-size="16" fill="#282722" text-anchor="middle">TypeSafe AI</text>
  <circle cx="400" cy="265" r="54" fill="#fff" stroke="#746b60" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="400" y="261" font-family="sans-serif" font-size="16" fill="#746b60" text-anchor="middle">其他团队的</text>
  <text x="400" y="284" font-family="sans-serif" font-size="16" fill="#746b60" text-anchor="middle">同类模型</text>
  <circle cx="385" cy="395" r="46" fill="#fff" stroke="#746b60" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="385" y="391" font-family="sans-serif" font-size="16" fill="#746b60" text-anchor="middle">更多</text>
  <text x="385" y="413" font-family="sans-serif" font-size="16" fill="#746b60" text-anchor="middle">同类模型</text>
  <text x="250" y="462" font-family="sans-serif" font-size="19" fill="#ad4e3e" text-anchor="middle" font-weight="bold">↑ Jev 只是其中之一</text>

  <!-- RIGHT: how the class differs from common LLMs -->
  <text x="620" y="150" font-family="sans-serif" font-size="20" font-weight="bold" fill="#282722">这一类模型与常见 LLM 的区别</text>

  <text x="620" y="208" font-family="sans-serif" font-size="18" font-weight="bold" fill="#282722">常见 LLM</text>
  <g font-family="sans-serif" font-size="16" fill="#282722" text-anchor="middle">
    <rect x="620" y="225" width="44" height="36" rx="4" fill="#fff" stroke="#282722" stroke-width="1.5"/>
    <text x="642" y="249">1</text>
    <rect x="686" y="225" width="44" height="36" rx="4" fill="#fff" stroke="#282722" stroke-width="1.5"/>
    <text x="708" y="249">2</text>
    <rect x="752" y="225" width="44" height="36" rx="4" fill="#fff" stroke="#282722" stroke-width="1.5"/>
    <text x="774" y="249">3</text>
    <rect x="818" y="225" width="44" height="36" rx="4" fill="#fff" stroke="#282722" stroke-width="1.5"/>
    <text x="840" y="249">4</text>
  </g>
  <g stroke="#282722" stroke-width="1.5">
    <line x1="664" y1="243" x2="684" y2="243" marker-end="url(#inkArrow2)"/>
    <line x1="730" y1="243" x2="750" y2="243" marker-end="url(#inkArrow2)"/>
    <line x1="796" y1="243" x2="816" y2="243" marker-end="url(#inkArrow2)"/>
    <line x1="862" y1="243" x2="902" y2="243" marker-end="url(#inkArrow2)"/>
  </g>
  <rect x="905" y="222" width="215" height="42" rx="4" fill="none" stroke="#282722" stroke-width="1.5"/>
  <text x="1012" y="250" font-family="sans-serif" font-size="17" fill="#282722" text-anchor="middle">一段字符串</text>
  <text x="620" y="296" font-family="sans-serif" font-size="16" fill="#746b60">逐个 token 生成，下游再解析</text>

  <line x1="620" y1="322" x2="1120" y2="322" stroke="#282722" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="620" y="360" font-family="sans-serif" font-size="18" font-weight="bold" fill="#282722">System One 模型</text>
  <rect x="620" y="392" width="120" height="44" rx="4" fill="#fff" stroke="#282722" stroke-width="2"/>
  <text x="680" y="420" font-family="sans-serif" font-size="17" fill="#282722" text-anchor="middle">一次查询</text>
  <g stroke="#282722" stroke-width="1.5" fill="none">
    <path d="M 740 414 C 800 414, 820 382, 898 382" marker-end="url(#inkArrow2)"/>
    <line x1="740" y1="414" x2="898" y2="414" marker-end="url(#inkArrow2)"/>
    <path d="M 740 414 C 800 414, 820 446, 898 446" marker-end="url(#inkArrow2)"/>
  </g>
  <text x="820" y="372" font-family="sans-serif" font-size="14" fill="#746b60" text-anchor="middle">并行采样</text>
  <rect x="902" y="364" width="218" height="100" rx="6" fill="#efd15b" opacity="0.45" stroke="#e4b936" stroke-width="1.5"/>
  <text x="920" y="396" font-family="sans-serif" font-size="17" fill="#282722">结果：通过</text>
  <text x="920" y="423" font-family="sans-serif" font-size="17" fill="#282722">类型：选择</text>
  <text x="920" y="450" font-family="sans-serif" font-size="17" fill="#282722">概率：0.92</text>
  <text x="620" y="492" font-family="sans-serif" font-size="16" fill="#746b60">直接输出带类型的结构化值 + 校准概率</text>

  <rect x="230" y="525" width="740" height="52" rx="6" fill="none" stroke="#ad4e3e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="559" font-family="sans-serif" font-size="23" fill="#ad4e3e" text-anchor="middle" font-weight="bold">Jev 属于 System One，System One 不等于 Jev</text>

  <text x="60" y="612" font-family="sans-serif" font-size="14" fill="#aaa">第二节 · System One 是一类模型的名字</text>
</svg>
