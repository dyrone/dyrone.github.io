<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t3 d3">
  <title id="t3">为什么"接入 Jev"不准确</title>
  <desc id="d3">左侧对话气泡说"我们接入了 Jev"，红色虚线分别指向四张卡片：合作关系被误读、能力预期错位、品牌与合规风险、内部沟通含混；底部类比"接入 GPT-5 不等于接入大语言模型"。</desc>

  <rect width="1200" height="630" fill="#fffdf7"/>
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>
  <defs>
    <marker id="arrowRed3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ad4e3e"/>
    </marker>
  </defs>

  <text x="600" y="62" font-family="sans-serif" font-size="26" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-2, 600, 62)">一句话，四种误读</text>

  <!-- speech bubble -->
  <rect x="70" y="245" width="300" height="100" rx="22" fill="#fff" stroke="#282722" stroke-width="2.5"/>
  <polygon points="120,343 110,385 160,343" fill="#fff" stroke="#282722" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="123" y1="343" x2="157" y2="343" stroke="#fff" stroke-width="4"/>
  <rect x="263" y="278" width="56" height="36" fill="#efd15b" opacity="0.6"/>
  <text x="220" y="305" font-family="sans-serif" font-size="27" font-weight="bold" fill="#282722" text-anchor="middle">我们接入了 Jev</text>

  <!-- arrows -->
  <g stroke="#ad4e3e" stroke-width="2" fill="none" stroke-dasharray="6,3">
    <path d="M 370 280 C 450 200, 480 150, 552 145" marker-end="url(#arrowRed3)"/>
    <path d="M 370 290 C 450 260, 490 245, 552 245" marker-end="url(#arrowRed3)"/>
    <path d="M 370 305 C 450 330, 490 345, 552 345" marker-end="url(#arrowRed3)"/>
    <path d="M 370 320 C 450 400, 480 440, 552 445" marker-end="url(#arrowRed3)"/>
  </g>

  <!-- four cards -->
  <g font-family="sans-serif">
    <rect x="560" y="108" width="570" height="76" rx="8" fill="#fff" stroke="#282722" stroke-width="2"/>
    <text x="585" y="153" font-size="21" font-weight="bold" fill="#282722">合作关系</text>
    <text x="710" y="153" font-size="18" fill="#555">以为我们和 TypeSafe 有合作</text>

    <rect x="560" y="208" width="570" height="76" rx="8" fill="#fff" stroke="#282722" stroke-width="2"/>
    <text x="585" y="253" font-size="21" font-weight="bold" fill="#282722">能力预期</text>
    <text x="710" y="253" font-size="18" fill="#555">把 Jev 的评测结果套到别的模型上</text>

    <rect x="560" y="308" width="570" height="76" rx="8" fill="#fff" stroke="#282722" stroke-width="2"/>
    <text x="585" y="353" font-size="21" font-weight="bold" fill="#282722">品牌合规</text>
    <text x="710" y="353" font-size="18" fill="#555">对外材料借用别家公司的模型名</text>

    <rect x="560" y="408" width="570" height="76" rx="8" fill="#fff" stroke="#282722" stroke-width="2"/>
    <text x="585" y="453" font-size="21" font-weight="bold" fill="#282722">内部沟通</text>
    <text x="710" y="453" font-size="18" fill="#555">采购、结算、排障：到底接的是谁？</text>
  </g>

  <rect x="300" y="515" width="600" height="54" rx="6" fill="none" stroke="#ad4e3e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="550" font-family="sans-serif" font-size="23" fill="#ad4e3e" text-anchor="middle" font-weight="bold">接入 GPT-5 ≠ 接入大语言模型</text>

  <text x="60" y="610" font-family="sans-serif" font-size="14" fill="#aaa">第三节 · 为什么"接入 Jev"不准确</text>
</svg>
