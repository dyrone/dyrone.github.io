<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t6 d6">
  <title id="t6">System One 模型还是 Decision 模型</title>
  <desc id="d6">左右两张对照卡：左侧 System One 模型的优点是继承 TypeSafe 品类命名、绑定卡尼曼比喻、品类讨论稳定，缺点是带供应商暗示、对不熟悉卡尼曼的读者需要额外解释、名字不描述能力；右侧 Decision 模型的优点是大厂通用名、自带语义、更中性，缺点是容易与规则引擎决策树混淆、短期多种变体不统一、失去卡尼曼隐喻。底部给出按场景选名的建议。</desc>

  <rect width="1200" height="720" fill="#fffdf7"/>
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
    <line x1="60" y1="640" x2="1140" y2="640"/>
  </g>

  <text x="600" y="62" font-family="sans-serif" font-size="26" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-2, 600, 62)">两种叫法各自的得失</text>

  <!-- LEFT: System One 模型 -->
  <rect x="70" y="100" width="520" height="500" rx="10" fill="#f7f0de" stroke="#282722" stroke-width="2"/>
  <rect x="70" y="100" width="520" height="60" rx="10" fill="#efd15b" opacity="0.6"/>
  <text x="330" y="140" font-family="sans-serif" font-size="22" font-weight="bold" fill="#282722" text-anchor="middle">System One 模型</text>

  <text x="100" y="195" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2a7a4a">优点</text>
  <g font-family="sans-serif" font-size="15" fill="#282722">
    <text x="100" y="222">· 继承 TypeSafe 品类命名，自带 Jev 血统</text>
    <text x="100" y="246">· 挂钩卡尼曼"系统 1"，解释范式有隐喻</text>
    <text x="100" y="270">· 学术、品类、架构讨论更稳定</text>
  </g>

  <text x="100" y="335" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ad4e3e">缺点</text>
  <g font-family="sans-serif" font-size="15" fill="#282722">
    <text x="100" y="362">· 带 TypeSafe 的供应商暗示</text>
    <text x="100" y="386">· 不熟悉卡尼曼的人要再解释一遍</text>
    <text x="100" y="410">· 名字本身不描述模型做什么</text>
  </g>

  <text x="330" y="565" font-family="sans-serif" font-size="18" fill="#ad4e3e" text-anchor="middle" font-weight="bold">适合：技术分析、品类讨论</text>

  <!-- RIGHT: Decision 模型 -->
  <rect x="610" y="100" width="520" height="500" rx="10" fill="#f7f0de" stroke="#282722" stroke-width="2"/>
  <rect x="610" y="100" width="520" height="60" rx="10" fill="#efd15b" opacity="0.6"/>
  <text x="870" y="140" font-family="sans-serif" font-size="22" font-weight="bold" fill="#282722" text-anchor="middle">Decision 模型</text>

  <text x="640" y="195" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2a7a4a">优点</text>
  <g font-family="sans-serif" font-size="15" fill="#282722">
    <text x="640" y="222">· 大厂事实通用名，和产品 API 一致</text>
    <text x="640" y="246">· "决策"自带语义，不认识 Jev 也能懂</text>
    <text x="640" y="270">· 中性，不绑定任何一家公司</text>
  </g>

  <text x="640" y="335" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ad4e3e">缺点</text>
  <g font-family="sans-serif" font-size="15" fill="#282722">
    <text x="640" y="362">· 和规则引擎、决策树等旧词易混</text>
    <text x="640" y="386">· 行业暂无统一叫法：Decider / Decide / Decisions</text>
    <text x="640" y="410">· 失去卡尼曼比喻，谈范式要多说一句</text>
  </g>

  <text x="870" y="565" font-family="sans-serif" font-size="18" fill="#ad4e3e" text-anchor="middle" font-weight="bold">适合：对外写作、产品沟通</text>

  <!-- Bottom guidance stripe -->
  <rect x="70" y="625" width="1060" height="60" rx="10" fill="#282722"/>
  <text x="600" y="662" font-family="sans-serif" font-size="18" fill="#fffdf7" text-anchor="middle" font-weight="bold">并存期先写一个、括号补另一个；不要再用 Jev 做泛指</text>

  <text x="60" y="705" font-family="sans-serif" font-size="14" fill="#aaa">第六节 · System One 还是 Decision，哪个更合适</text>
</svg>
