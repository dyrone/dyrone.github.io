<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>结语 — 先学会不签自己没读过的东西</title>
  <desc>浏览器窗口中的"服务协议更新"，灰色假文之间有一条黄色高亮的默认勾选条款，一枚放大镜聚焦"自动续费"字样，光标悬停在黄色"同意并继续"按钮上。</desc>

  <!-- cream paper background -->
  <rect width="1200" height="630" fill="#fffdf7"/>
  <!-- faint ruled lines -->
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>

  <!-- top red annotation -->
  <text x="600" y="62" font-family="sans-serif" font-size="26" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-2.5, 600, 62)">先学会不签自己没读过的东西</text>

  <!-- ===== browser window ===== -->
  <rect x="250" y="95" width="700" height="375" rx="10" fill="#fff" stroke="#282722" stroke-width="2"/>
  <line x1="250" y1="135" x2="950" y2="135" stroke="#282722" stroke-width="1.5"/>
  <circle cx="276" cy="115" r="6" fill="#ad4e3e"/>
  <circle cx="298" cy="115" r="6" fill="#efd15b"/>
  <circle cx="320" cy="115" r="6" fill="#bbb"/>
  <text x="285" y="170" font-family="sans-serif" font-size="20" fill="#282722" font-weight="bold">服务协议更新</text>

  <!-- fake body text -->
  <g stroke="#ccc" stroke-width="1.5">
    <line x1="285" y1="204" x2="620" y2="204"/>
    <line x1="285" y1="222" x2="660" y2="222"/>
    <line x1="285" y1="240" x2="580" y2="240"/>
    <line x1="285" y1="258" x2="640" y2="258"/>
    <line x1="285" y1="276" x2="600" y2="276"/>
    <line x1="285" y1="294" x2="655" y2="294"/>
  </g>

  <!-- highlighted auto-renew clause -->
  <rect x="280" y="314" width="470" height="28" rx="3" fill="#efd15b" opacity="0.55"/>
  <text x="295" y="333" font-family="sans-serif" font-size="15" fill="#282722">☑ 默认勾选：自动续费并共享使用数据</text>

  <g stroke="#ccc" stroke-width="1.5">
    <line x1="285" y1="364" x2="640" y2="364"/>
    <line x1="285" y1="382" x2="600" y2="382"/>
  </g>

  <!-- agree button + cursor -->
  <rect x="520" y="402" width="190" height="48" rx="8" fill="#efd15b" opacity="0.6" stroke="#282722" stroke-width="2"/>
  <text x="615" y="433" font-family="sans-serif" font-size="20" fill="#282722" text-anchor="middle" font-weight="bold">同意并继续</text>
  <polygon points="672,440 672,460 677,456 680,463 683.5,461.5 680.5,455 686,455" fill="#282722" stroke="#fff" stroke-width="1.5"/>

  <!-- magnifier over the clause -->
  <circle cx="788" cy="328" r="46" fill="#fffdf7" fill-opacity="0.55" stroke="#282722" stroke-width="3"/>
  <text x="788" y="334" font-family="sans-serif" font-size="15" fill="#ad4e3e" text-anchor="middle" font-weight="bold">自动续费</text>
  <line x1="822" y1="362" x2="856" y2="396" stroke="#282722" stroke-width="4" stroke-linecap="round"/>

  <!-- bottom takeaway -->
  <rect x="250" y="520" width="700" height="55" rx="6" fill="none" stroke="#ad4e3e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="555" font-family="sans-serif" font-size="24" fill="#ad4e3e" text-anchor="middle" font-weight="bold">默认值变成事实标准之前，是普通用户的窗口期</text>

  <!-- chapter label -->
  <text x="70" y="610" font-family="sans-serif" font-size="14" fill="#aaa">第五节 · 结语</text>
</svg>
