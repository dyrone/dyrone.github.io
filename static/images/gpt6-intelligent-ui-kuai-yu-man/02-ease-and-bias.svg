<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>省力与偏差 — 长在控件里的锚</title>
  <desc>左侧一条顺滑的滑道把读者直送"确认"按钮；右侧一个导出表单，默认值被黄色高亮，旁边画着红色锚，批注"长在控件里的锚，避不开"。</desc>

  <!-- cream paper background -->
  <rect width="1200" height="630" fill="#fffdf7"/>
  <!-- faint ruled lines -->
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>

  <!-- ===== RED ANNOTATION (top) ===== -->
  <text x="600" y="58" font-family="sans-serif" font-size="26" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-3, 600, 58)">长在控件里的锚，避不开</text>

  <!-- ===== LEFT: smooth slide to confirm ===== -->
  <!-- long answer = fake text lines -->
  <g stroke="#ccc" stroke-width="1.5">
    <line x1="90" y1="120" x2="480" y2="120"/>
    <line x1="90" y1="145" x2="460" y2="145"/>
    <line x1="90" y1="170" x2="480" y2="170"/>
    <line x1="90" y1="195" x2="440" y2="195"/>
  </g>
  <!-- slide curve -->
  <path d="M 100 240 C 260 250, 380 310, 450 405" stroke="#282722" stroke-width="3" fill="none"/>
  <circle cx="456" cy="418" r="14" fill="#efd15b" stroke="#e4b936" stroke-width="2"/>
  <!-- big confirm button -->
  <rect x="370" y="460" width="170" height="54" rx="8" fill="#fff" stroke="#282722" stroke-width="2.5"/>
  <text x="455" y="496" font-family="sans-serif" font-size="26" fill="#282722" text-anchor="middle" font-weight="bold">确认</text>
  <!-- captions -->
  <text x="170" y="310" font-family="sans-serif" font-size="18" fill="#555">顺着读，很顺</text>
  <text x="170" y="336" font-family="sans-serif" font-size="14" fill="#999">越长越难拒绝</text>

  <!-- ===== RIGHT: form with anchor ===== -->
  <rect x="650" y="170" width="470" height="210" rx="8" fill="#fff" stroke="#282722" stroke-width="2"/>
  <text x="675" y="205" font-family="sans-serif" font-size="16" fill="#555">导出报表</text>
  <!-- row 1: default value -->
  <rect x="675" y="225" width="300" height="40" rx="4" fill="none" stroke="#282722" stroke-width="1.5"/>
  <rect x="687" y="233" width="150" height="24" fill="#efd15b" opacity="0.55"/>
  <text x="695" y="252" font-family="sans-serif" font-size="16" fill="#282722">时间范围：近一年</text>
  <!-- anchor icon -->
  <g stroke="#ad4e3e" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="1050" cy="215" r="7"/>
    <line x1="1050" y1="222" x2="1050" y2="272"/>
    <line x1="1034" y1="236" x2="1066" y2="236"/>
    <path d="M 1030 258 A 20 20 0 0 0 1070 258"/>
  </g>
  <!-- row 2: pre-checked option -->
  <rect x="675" y="290" width="22" height="22" fill="#efd15b" opacity="0.55" stroke="#282722" stroke-width="1.5"/>
  <path d="M 679 301 l 5 6 l 9 -12" stroke="#282722" stroke-width="2" fill="none"/>
  <text x="710" y="308" font-family="sans-serif" font-size="16" fill="#282722">使用推荐配置</text>
  <text x="675" y="352" font-family="sans-serif" font-size="14" fill="#999">大多数人会直接点下一步……</text>
  <!-- red note under form -->
  <text x="885" y="435" font-family="sans-serif" font-size="22" fill="#ad4e3e" font-style="italic" text-anchor="middle" transform="rotate(-3, 885, 435)">数字一出现即成锚</text>

  <!-- ===== BOTTOM: key question ===== -->
  <rect x="250" y="520" width="700" height="55" rx="6" fill="none" stroke="#ad4e3e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="555" font-family="sans-serif" font-size="24" fill="#ad4e3e" text-anchor="middle" font-weight="bold">便宜的交互给了「核验」，还是给了「确认」？</text>

  <!-- bottom label -->
  <text x="70" y="610" font-family="sans-serif" font-size="14" fill="#aaa">第二节 · 省力与偏差</text>
</svg>
