<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>媒介演进 — 生产成本趋零，主动核验下线</title>
  <desc>上方黄色上升箭头表示画面感上升，灰色下降虚线箭头表示可核验性下降；下方时间轴依次为文字、图片、动画、视频四个媒介阶段，虚线延伸至下一站 Agent 界面，红色批注"还停在路线图上"。</desc>

  <!-- cream paper background -->
  <rect width="1200" height="630" fill="#fffdf7"/>
  <!-- faint ruled lines -->
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>

  <!-- top red annotation -->
  <text x="600" y="60" font-family="sans-serif" font-size="26" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-2.5, 600, 60)">生产成本趋零，主动核验下线</text>

  <!-- crossing tradeoff arrows -->
  <defs>
    <marker id="arrowY" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0 0, 18 6, 0 12" fill="#e4b936"/>
    </marker>
    <marker id="arrowG" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="11" refX="14" refY="5.5" orient="auto">
      <polygon points="0 0, 16 5.5, 0 11" fill="#bbb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ad4e3e"/>
    </marker>
  </defs>
  <!-- ascending: 画面感 -->
  <line x1="110" y1="225" x2="745" y2="115" stroke="#e4b936" stroke-width="4" marker-end="url(#arrowY)"/>
  <rect x="757" y="98" width="160" height="30" rx="4" fill="#efd15b" opacity="0.5"/>
  <text x="837" y="119" font-family="sans-serif" font-size="18" fill="#282722" text-anchor="middle" font-weight="bold">画面感 ↑</text>
  <!-- descending dashed: 可核验性 -->
  <line x1="110" y1="115" x2="745" y2="225" stroke="#bbb" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrowG)"/>
  <text x="760" y="233" font-family="sans-serif" font-size="18" fill="#999" font-weight="bold">可核验性 ↓</text>

  <!-- ===== timeline ===== -->
  <!-- solid past -->
  <line x1="80" y1="380" x2="810" y2="380" stroke="#282722" stroke-width="2.5"/>
  <!-- dashed future -->
  <line x1="810" y1="380" x2="1080" y2="380" stroke="#aaa" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- nodes -->
  <circle cx="140" cy="380" r="8" fill="#fff" stroke="#282722" stroke-width="2.5"/>
  <circle cx="330" cy="380" r="8" fill="#fff" stroke="#282722" stroke-width="2.5"/>
  <circle cx="520" cy="380" r="8" fill="#fff" stroke="#282722" stroke-width="2.5"/>
  <circle cx="710" cy="380" r="8" fill="#efd15b" stroke="#e4b936" stroke-width="2.5"/>
  <circle cx="990" cy="380" r="8" fill="#fff" stroke="#bbb" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- icons above baseline -->
  <!-- 文字: document -->
  <rect x="120" y="300" width="40" height="52" rx="3" fill="#fff" stroke="#282722" stroke-width="2"/>
  <g stroke="#ccc" stroke-width="1.5">
    <line x1="127" y1="313" x2="153" y2="313"/>
    <line x1="127" y1="325" x2="153" y2="325"/>
    <line x1="127" y1="337" x2="149" y2="337"/>
  </g>
  <!-- 图片: frame with sun and mountains -->
  <rect x="308" y="304" width="44" height="44" rx="3" fill="#fff" stroke="#282722" stroke-width="2"/>
  <circle cx="321" cy="317" r="5" fill="#efd15b" stroke="#e4b936" stroke-width="1.5"/>
  <polyline points="312,344 325,328 332,336 341,322 348,344" fill="none" stroke="#282722" stroke-width="2" stroke-linejoin="round"/>
  <!-- 动画: overlapping frames -->
  <rect x="496" y="298" width="38" height="46" rx="3" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="506" y="308" width="38" height="46" rx="3" fill="#fff" stroke="#282722" stroke-width="2"/>
  <!-- 视频: player with play button -->
  <rect x="686" y="302" width="48" height="46" rx="7" fill="#fff" stroke="#282722" stroke-width="2.5"/>
  <polygon points="705,313 705,337 727,325" fill="#efd15b" stroke="#e4b936" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Agent 界面: dashed window with cursor -->
  <rect x="966" y="302" width="48" height="46" rx="7" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="984,314 984,329 988,326 990.5,331 993,330 990.5,325 995,325" fill="#282722"/>

  <!-- station names -->
  <g font-family="sans-serif" font-size="18" font-weight="bold" fill="#282722" text-anchor="middle">
    <text x="140" y="420">文字</text>
    <text x="330" y="420">图片</text>
    <text x="520" y="420">动画</text>
    <text x="710" y="420">视频</text>
  </g>
  <text x="990" y="420" font-family="sans-serif" font-size="18" font-weight="bold" fill="#555" text-anchor="middle">Agent 界面</text>
  <!-- sublabels -->
  <g font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">
    <text x="140" y="444">要写</text>
    <text x="330" y="444">随手拍</text>
    <text x="520" y="444">引导</text>
    <text x="710" y="444">自动播放</text>
    <text x="990" y="444">（下一站）</text>
  </g>

  <!-- red roadmap arc from 视频 to Agent 界面 -->
  <path d="M 722 372 Q 850 272 982 372" stroke="#ad4e3e" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="852" y="306" font-family="sans-serif" font-size="18" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic">还停在路线图上</text>

  <!-- bottom takeaway -->
  <rect x="250" y="520" width="700" height="55" rx="6" fill="none" stroke="#ad4e3e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="555" font-family="sans-serif" font-size="24" fill="#ad4e3e" text-anchor="middle" font-weight="bold">把人从「主动验证」训练成「被动确认」</text>

  <!-- chapter label -->
  <text x="70" y="610" font-family="sans-serif" font-size="14" fill="#aaa">第三节 · 媒介演进</text>
</svg>
