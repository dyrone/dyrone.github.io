<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>优化 ≠ 拐点 — 从实现细节读出的三个克制判断</title>
  <desc>一条公路上立着黄色路牌"体验优化"（GPT-6 · 现在），远方是虚线路牌"拐点？"，路牌下标注"需要新原语：长程自主执行"；公路下方三块标牌：范式未变、成本上行、生态未开。</desc>

  <!-- cream paper background -->
  <rect width="1200" height="630" fill="#fffdf7"/>
  <!-- faint ruled lines -->
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>

  <!-- top red annotation -->
  <text x="600" y="62" font-family="sans-serif" font-size="30" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-2, 600, 62)">优化 ≠ 拐点</text>

  <!-- ===== road ===== -->
  <line x1="60" y1="310" x2="1140" y2="310" stroke="#282722" stroke-width="2.5"/>
  <line x1="60" y1="370" x2="1140" y2="370" stroke="#282722" stroke-width="2.5"/>
  <line x1="60" y1="340" x2="1140" y2="340" stroke="#282722" stroke-width="2" stroke-dasharray="20,14" opacity="0.5"/>

  <!-- ===== NOW sign ===== -->
  <rect x="425" y="190" width="10" height="120" fill="#282722"/>
  <rect x="320" y="125" width="220" height="64" rx="4" fill="#efd15b" opacity="0.55"/>
  <rect x="320" y="125" width="220" height="64" rx="4" fill="none" stroke="#282722" stroke-width="2"/>
  <text x="430" y="166" font-family="sans-serif" font-size="26" fill="#282722" text-anchor="middle" font-weight="bold">体验优化</text>
  <text x="430" y="398" font-family="sans-serif" font-size="16" fill="#888" text-anchor="middle">GPT-6 · 现在</text>

  <!-- ===== FUTURE sign (dashed) ===== -->
  <rect x="900" y="190" width="10" height="120" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="795" y="125" width="220" height="64" rx="4" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="905" y="166" font-family="sans-serif" font-size="26" fill="#999" text-anchor="middle" font-weight="bold">拐点？</text>
  <text x="905" y="398" font-family="sans-serif" font-size="15" fill="#999" text-anchor="middle">需要新原语：长程自主执行</text>

  <!-- ===== three placards ===== -->
  <g>
    <rect x="165" y="460" width="210" height="46" rx="6" fill="#fff" stroke="#282722" stroke-width="1.5"/>
    <circle cx="190" cy="483" r="5" fill="#efd15b" stroke="#e4b936" stroke-width="1.5"/>
    <text x="208" y="489" font-family="sans-serif" font-size="17" fill="#282722">范式未变</text>
  </g>
  <g>
    <rect x="495" y="460" width="210" height="46" rx="6" fill="#fff" stroke="#282722" stroke-width="1.5"/>
    <circle cx="520" cy="483" r="5" fill="#ad4e3e"/>
    <text x="538" y="489" font-family="sans-serif" font-size="17" fill="#282722">成本上行</text>
  </g>
  <g>
    <rect x="825" y="460" width="210" height="46" rx="6" fill="#fff" stroke="#282722" stroke-width="1.5"/>
    <circle cx="850" cy="483" r="5" fill="#999"/>
    <text x="868" y="489" font-family="sans-serif" font-size="17" fill="#282722">生态未开</text>
  </g>

  <!-- bottom takeaway -->
  <rect x="250" y="520" width="700" height="55" rx="6" fill="none" stroke="#ad4e3e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="555" font-family="sans-serif" font-size="24" fill="#ad4e3e" text-anchor="middle" font-weight="bold">别把持续优化当成革命</text>

  <!-- chapter label -->
  <text x="70" y="610" font-family="sans-serif" font-size="14" fill="#aaa">第四节 · 三个克制判断</text>
</svg>
