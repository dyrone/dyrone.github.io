<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t1 d1">
  <title id="t1">Jev 是 TypeSafe AI 的模型名</title>
  <desc id="d1">一张模型名片写着 Jev、出品方 TypeSafe AI、所属类别 System One 模型；右侧红笔划掉 JEV 和 Type Safe 两种误写，并更正为 Jev 和 TypeSafe。</desc>

  <rect width="1200" height="630" fill="#fffdf7"/>
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>
  <defs>
    <marker id="arrowRed1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ad4e3e"/>
    </marker>
  </defs>

  <text x="600" y="62" font-family="sans-serif" font-size="26" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-2, 600, 62)">Jev 是一个具体模型的名字</text>

  <!-- name card -->
  <rect x="150" y="120" width="540" height="340" rx="14" fill="#fff" stroke="#282722" stroke-width="2.5"/>
  <text x="185" y="165" font-family="sans-serif" font-size="17" fill="#746b60">模型名片</text>
  <line x1="185" y1="180" x2="655" y2="180" stroke="#282722" stroke-width="1"/>
  <rect x="178" y="205" width="180" height="92" fill="#efd15b" opacity="0.55"/>
  <text x="190" y="282" font-family="sans-serif" font-size="88" font-weight="bold" fill="#282722">Jev</text>
  <text x="185" y="355" font-family="sans-serif" font-size="24" fill="#282722">出品方：TypeSafe AI</text>
  <text x="185" y="405" font-family="sans-serif" font-size="24" fill="#282722">所属类别：System One 模型</text>

  <!-- corrections -->
  <text x="780" y="165" font-family="sans-serif" font-size="18" fill="#746b60">常见误写</text>
  <text x="780" y="240" font-family="sans-serif" font-size="38" fill="#999">JEV</text>
  <line x1="772" y1="226" x2="866" y2="226" stroke="#ad4e3e" stroke-width="3"/>
  <text x="780" y="282" font-family="sans-serif" font-size="21" fill="#ad4e3e">→ Jev，只有首字母大写</text>
  <text x="780" y="365" font-family="sans-serif" font-size="34" fill="#999">Type Safe</text>
  <line x1="772" y1="353" x2="935" y2="353" stroke="#ad4e3e" stroke-width="3"/>
  <text x="780" y="407" font-family="sans-serif" font-size="21" fill="#ad4e3e">→ TypeSafe，一个词</text>
  <path d="M 770 300 C 735 300, 720 280, 700 270" stroke="#ad4e3e" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowRed1)"/>

  <rect x="250" y="510" width="700" height="56" rx="6" fill="none" stroke="#ad4e3e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="546" font-family="sans-serif" font-size="24" fill="#ad4e3e" text-anchor="middle" font-weight="bold">一个名字 = 一家公司的一个模型</text>

  <text x="60" y="610" font-family="sans-serif" font-size="14" fill="#aaa">第一节 · Jev 是 TypeSafe AI 的模型名</text>
</svg>
