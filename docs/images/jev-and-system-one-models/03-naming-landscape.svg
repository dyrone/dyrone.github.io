<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t3 d3">
  <title id="t3">大厂与创业公司怎么称呼这类模型</title>
  <desc id="d3">左右两张清单对比：左侧沿用"System One 模型"命名的，有 TypeSafe 的 Jev、Google DeepMind 的 DiffusionGemma、以及开源项目 Kev；右侧换用"Decision model / Decisions"命名的，有微软、OpenAI、Amazon、Cloudflare、Fastino、Together AI、国内 StartLux。</desc>

  <rect width="1200" height="720" fill="#fffdf7"/>
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
    <line x1="60" y1="640" x2="1140" y2="640"/>
  </g>

  <text x="600" y="62" font-family="sans-serif" font-size="26" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-2, 600, 62)">两种命名阵营</text>

  <!-- LEFT column: System One camp -->
  <rect x="70" y="100" width="520" height="560" rx="10" fill="#f7f0de" stroke="#282722" stroke-width="2"/>
  <rect x="70" y="100" width="520" height="60" rx="10" fill="#efd15b" opacity="0.6"/>
  <text x="330" y="140" font-family="sans-serif" font-size="22" font-weight="bold" fill="#282722" text-anchor="middle">沿用 System One 模型</text>

  <g font-family="sans-serif" fill="#282722">
    <text x="100" y="200" font-size="18" font-weight="bold">TypeSafe AI</text>
    <text x="100" y="226" font-size="16" fill="#746b60">Jev · 自己造的词</text>

    <text x="100" y="276" font-size="18" font-weight="bold">Google DeepMind</text>
    <text x="100" y="302" font-size="16" fill="#746b60">DiffusionGemma · 文档明写 System One</text>

    <text x="100" y="352" font-size="18" font-weight="bold">开源 Kev（Jared Palmer）</text>
    <text x="100" y="378" font-size="16" fill="#746b60">显式沿用 TypeSafe 的 System One 契约</text>
  </g>

  <text x="330" y="620" font-family="sans-serif" font-size="18" fill="#ad4e3e" text-anchor="middle" font-weight="bold">品类命名权暂握在 TypeSafe 手里</text>

  <!-- RIGHT column: Decision model camp -->
  <rect x="610" y="100" width="520" height="560" rx="10" fill="#f7f0de" stroke="#282722" stroke-width="2"/>
  <rect x="610" y="100" width="520" height="60" rx="10" fill="#efd15b" opacity="0.6"/>
  <text x="870" y="140" font-family="sans-serif" font-size="22" font-weight="bold" fill="#282722" text-anchor="middle">换用 Decision model / Decisions</text>

  <g font-family="sans-serif" fill="#282722">
    <text x="640" y="195" font-size="17" font-weight="bold">Microsoft Foundry</text>
    <text x="640" y="218" font-size="15" fill="#746b60">Microsoft-Decision-1 · 不提 System One</text>

    <text x="640" y="258" font-size="17" font-weight="bold">OpenAI</text>
    <text x="640" y="281" font-size="15" fill="#746b60">Decisions API · 跑在 GPT-6 Luna 上</text>

    <text x="640" y="321" font-size="17" font-weight="bold">Amazon</text>
    <text x="640" y="344" font-size="15" fill="#746b60">Strands Decider 2B · "AI decision model"</text>

    <text x="640" y="384" font-size="17" font-weight="bold">Cloudflare</text>
    <text x="640" y="407" font-size="15" fill="#746b60">Clef / Clef-Flash · 开源决策模型</text>

    <text x="640" y="447" font-size="17" font-weight="bold">Fastino</text>
    <text x="640" y="470" font-size="15" fill="#746b60">GLiNER2.5-Decide · 开源决策模型</text>

    <text x="640" y="510" font-size="17" font-weight="bold">Together AI</text>
    <text x="640" y="533" font-size="15" fill="#746b60">Tev1 · open-weight decision model</text>

    <text x="640" y="573" font-size="17" font-weight="bold">StartLux（上海）</text>
    <text x="640" y="596" font-size="15" fill="#746b60">StartLux-Decision · 开源"决策模型"</text>
  </g>

  <text x="870" y="645" font-family="sans-serif" font-size="18" fill="#ad4e3e" text-anchor="middle" font-weight="bold">大厂集体绕开"System One"</text>

  <text x="60" y="700" font-family="sans-serif" font-size="14" fill="#aaa">第三节 · 大厂与创业公司怎么称呼这类模型</text>
</svg>
