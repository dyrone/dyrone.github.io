<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t4 d4">
  <title id="t4">按实际情况选择说法</title>
  <desc id="d4">一棵判断树：先问是否真的调用 TypeSafe 的 Jev，是则说"接入 Jev（TypeSafe AI）"；否则正式场合说"接入 System One 模型（系统-1 模型）"，对方熟悉 Jev 的口头沟通可说"接入类 Jev 模型"。左下角列出书写细节。</desc>

  <rect width="1200" height="630" fill="#fffdf7"/>
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>
  <defs>
    <marker id="inkArrow4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#282722"/>
    </marker>
  </defs>

  <text x="600" y="58" font-family="sans-serif" font-size="26" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-2, 600, 58)">先问接的是谁，再决定怎么叫</text>

  <!-- root question -->
  <rect x="380" y="95" width="440" height="60" rx="30" fill="#fff" stroke="#282722" stroke-width="2.5"/>
  <text x="600" y="133" font-family="sans-serif" font-size="22" font-weight="bold" fill="#282722" text-anchor="middle">真的调用 TypeSafe 的 Jev 吗？</text>

  <g stroke="#282722" stroke-width="2" fill="none">
    <path d="M 520 155 C 440 200, 320 200, 265 245" marker-end="url(#inkArrow4)"/>
    <path d="M 680 155 C 760 190, 860 190, 890 225" marker-end="url(#inkArrow4)"/>
  </g>
  <text x="380" y="210" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ad4e3e">是</text>
  <text x="800" y="205" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ad4e3e">否</text>

  <!-- leaf: yes -->
  <rect x="90" y="250" width="350" height="74" rx="8" fill="#efd15b" opacity="0.55" stroke="#e4b936" stroke-width="2"/>
  <text x="265" y="295" font-family="sans-serif" font-size="23" font-weight="bold" fill="#282722" text-anchor="middle">接入 Jev（TypeSafe AI）</text>

  <!-- second question -->
  <rect x="700" y="230" width="380" height="56" rx="28" fill="#fff" stroke="#282722" stroke-width="2"/>
  <text x="890" y="265" font-family="sans-serif" font-size="20" fill="#282722" text-anchor="middle">用的是同类模型，在什么场合？</text>

  <g stroke="#282722" stroke-width="2" fill="none">
    <path d="M 820 286 C 780 320, 700 330, 685 375" marker-end="url(#inkArrow4)"/>
    <path d="M 960 286 C 990 320, 1010 340, 1005 375" marker-end="url(#inkArrow4)"/>
  </g>
  <text x="640" y="335" font-family="sans-serif" font-size="17" fill="#746b60">正式场合</text>
  <text x="1010" y="335" font-family="sans-serif" font-size="17" fill="#746b60">口头沟通</text>

  <!-- leaf: formal -->
  <rect x="520" y="380" width="330" height="92" rx="8" fill="#efd15b" opacity="0.55" stroke="#e4b936" stroke-width="2"/>
  <text x="685" y="420" font-family="sans-serif" font-size="23" font-weight="bold" fill="#282722" text-anchor="middle">接入 System One 模型</text>
  <text x="685" y="452" font-family="sans-serif" font-size="18" fill="#282722" text-anchor="middle">（系统-1 模型）</text>

  <!-- leaf: informal -->
  <rect x="870" y="380" width="270" height="92" rx="8" fill="#fff" stroke="#282722" stroke-width="2"/>
  <text x="1005" y="420" font-family="sans-serif" font-size="23" font-weight="bold" fill="#282722" text-anchor="middle">接入类 Jev 模型</text>
  <text x="1005" y="452" font-family="sans-serif" font-size="16" fill="#746b60" text-anchor="middle">对方熟悉 Jev 时可用</text>

  <text x="830" y="512" font-family="sans-serif" font-size="18" fill="#ad4e3e" text-anchor="middle" font-weight="bold">↑ 正式文档优先用类别名</text>

  <!-- writing details -->
  <rect x="70" y="370" width="400" height="170" rx="8" fill="#f7f0de" stroke="#ad4e3e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="95" y="405" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ad4e3e">书写细节</text>
  <text x="95" y="442" font-family="sans-serif" font-size="18" fill="#282722">· 写 Jev，不写 JEV</text>
  <text x="95" y="474" font-family="sans-serif" font-size="18" fill="#282722">· 写 TypeSafe，不写 Type Safe</text>
  <text x="95" y="506" font-family="sans-serif" font-size="18" fill="#282722">· 模型 id 照服务方原样填写</text>

  <text x="60" y="610" font-family="sans-serif" font-size="14" fill="#aaa">第四节 · 建议的说法</text>
</svg>
