<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>可得性原则 — 容易想到的未必更重要</title>
  <desc>左侧大号报纸标题被黄色高亮，右侧灰色统计柱状图被忽视，红色批注提醒"用数据校验直觉"。</desc>

  <!-- cream paper background -->
  <rect width="1200" height="630" fill="#fffdf7"/>
  <!-- subtle ruled lines -->
  <g stroke="#e8e4d8" stroke-width="0.7">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
  </g>

  <!-- ===== LEFT: Newspaper headline area ===== -->
  <!-- newspaper frame -->
  <rect x="60" y="100" width="520" height="380" rx="4" fill="#fff" stroke="#282722" stroke-width="2"/>
  <!-- masthead -->
  <line x1="60" y1="155" x2="580" y2="155" stroke="#282722" stroke-width="2"/>
  <text x="320" y="142" font-family="sans-serif" font-size="22" font-weight="bold" fill="#282722" text-anchor="middle">每 日 头 条</text>
  <!-- thin double rule -->
  <line x1="80" y1="163" x2="560" y2="163" stroke="#282722" stroke-width="0.5"/>
  <line x1="80" y1="166" x2="560" y2="166" stroke="#282722" stroke-width="0.5"/>

  <!-- yellow highlighter band behind headline -->
  <rect x="85" y="178" width="470" height="52" rx="2" fill="#efd15b" opacity="0.55"/>
  <!-- main headline -->
  <text x="320" y="215" font-family="sans-serif" font-size="36" font-weight="bold" fill="#282722" text-anchor="middle">飞机失事！全球恐慌！</text>

  <!-- sub-headlines -->
  <text x="100" y="262" font-family="sans-serif" font-size="16" fill="#555">专家紧急呼吁加强安全检查……</text>
  <line x1="100" y1="278" x2="560" y2="278" stroke="#ddd" stroke-width="0.5"/>
  <text x="100" y="300" font-family="sans-serif" font-size="14" fill="#888">社交媒体转发量突破百万</text>
  <text x="100" y="324" font-family="sans-serif" font-size="14" fill="#888">恐惧情绪持续蔓延……</text>

  <!-- fake body text lines -->
  <g fill="none" stroke="#ccc" stroke-width="1">
    <line x1="100" y1="352" x2="400" y2="352"/>
    <line x1="100" y1="368" x2="450" y2="368"/>
    <line x1="100" y1="384" x2="380" y2="384"/>
    <line x1="100" y1="400" x2="430" y2="400"/>
    <line x1="100" y1="416" x2="350" y2="416"/>
    <line x1="100" y1="432" x2="460" y2="432"/>
    <line x1="100" y1="448" x2="300" y2="448"/>
  </g>

  <!-- ===== RIGHT: Statistical bar chart (grayed out, ignored) ===== -->
  <g opacity="0.35">
    <rect x="720" y="170" width="380" height="280" rx="4" fill="#f5f5f0" stroke="#aaa" stroke-width="1"/>
    <text x="910" y="200" font-family="sans-serif" font-size="15" fill="#999" text-anchor="middle">年度死亡原因统计</text>
    <!-- bars -->
    <rect x="760" y="230" width="180" height="24" rx="2" fill="#bbb"/>
    <text x="950" y="248" font-family="sans-serif" font-size="12" fill="#999">心脏病 610,000</text>
    <rect x="760" y="264" width="150" height="24" rx="2" fill="#bbb"/>
    <text x="920" y="282" font-family="sans-serif" font-size="12" fill="#999">癌症 590,000</text>
    <rect x="760" y="298" width="80" height="24" rx="2" fill="#bbb"/>
    <text x="850" y="316" font-family="sans-serif" font-size="12" fill="#999">事故 170,000</text>
    <rect x="760" y="332" width="40" height="24" rx="2" fill="#bbb"/>
    <text x="810" y="350" font-family="sans-serif" font-size="12" fill="#999">流感 56,000</text>
    <rect x="760" y="366" width="8" height="24" rx="2" fill="#bbb"/>
    <text x="778" y="384" font-family="sans-serif" font-size="12" fill="#999">空难 ~200</text>
    <!-- axis -->
    <line x1="758" y1="220" x2="758" y2="400" stroke="#aaa" stroke-width="1"/>
    <line x1="758" y1="400" x2="1080" y2="400" stroke="#aaa" stroke-width="1"/>
  </g>

  <!-- "ignored" cross-out scribbles on chart -->
  <g stroke="#ccc" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="710" y1="160" x2="1110" y2="460"/>
    <line x1="1110" y1="160" x2="710" y2="460"/>
  </g>

  <!-- ===== RED ANNOTATION: curved arrow from headline to question ===== -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ad4e3e"/>
    </marker>
  </defs>
  <!-- arrow path from headline area toward the right annotation -->
  <path d="M 560 210 C 620 180, 660 140, 750 120" stroke="#ad4e3e" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>

  <!-- red question text -->
  <text x="760" y="108" font-family="sans-serif" font-size="24" fill="#ad4e3e" font-style="italic" transform="rotate(-4, 760, 108)">容易想起 = 更重要？</text>

  <!-- ===== RED HANDWRITTEN NOTE at bottom ===== -->
  <!-- note underline squiggle -->
  <rect x="340" y="530" width="520" height="56" rx="3" fill="none" stroke="#ad4e3e" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="600" y="566" font-family="sans-serif" font-size="28" fill="#ad4e3e" text-anchor="middle" font-weight="bold" font-style="italic" transform="rotate(-1.5, 600, 566)">✎ 用数据校验直觉</text>

  <!-- small bracket mark -->
  <text x="310" y="568" font-family="sans-serif" font-size="34" fill="#ad4e3e">⌐</text>

  <!-- bottom-left chapter label -->
  <text x="70" y="610" font-family="sans-serif" font-size="14" fill="#aaa">第一章 · 可得性原则</text>
</svg>