<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>联想原则——概念之间的三种联想链接</title>
  <desc>展示概念A通过相似性、时空相接和因果关系三种联想链接激活概念B、C、D的语义网络示意图</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0.8 L9,3.5 L0,6.2" fill="none" stroke="#282722" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="#fffdf7"/>
  <line x1="72" y1="0" x2="72" y2="630" stroke="#c4a088" stroke-width="1" opacity="0.22"/>
  <line x1="0" y1="76" x2="1200" y2="76" stroke="#d4cfc2" stroke-width="0.7" opacity="0.3"/>

  <!-- Chapter title -->
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#282722" letter-spacing="3">第六章 · 联想原则</text>

  <!-- Activation ripples radiating from center node -->
  <circle cx="420" cy="315" r="105" fill="none" stroke="#efd15b" stroke-width="1.8" opacity="0.22" stroke-dasharray="8 5"/>
  <circle cx="420" cy="315" r="150" fill="none" stroke="#efd15b" stroke-width="1.2" opacity="0.14" stroke-dasharray="10 8"/>
  <circle cx="420" cy="315" r="195" fill="none" stroke="#efd15b" stroke-width="0.8" opacity="0.08" stroke-dasharray="14 10"/>

  <!-- ===== Yellow highlights behind connections ===== -->
  <line x1="477" y1="290" x2="790" y2="184" stroke="#efd15b" stroke-width="18" stroke-linecap="round" opacity="0.38"/>
  <line x1="477" y1="342" x2="790" y2="456" stroke="#efd15b" stroke-width="18" stroke-linecap="round" opacity="0.38"/>
  <line x1="364" y1="298" x2="222" y2="230" stroke="#efd15b" stroke-width="18" stroke-linecap="round" opacity="0.38"/>

  <!-- ===== Connection arrows ===== -->
  <line x1="477" y1="290" x2="795" y2="186" stroke="#282722" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="477" y1="342" x2="795" y2="454" stroke="#282722" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="364" y1="298" x2="222" y2="230" stroke="#282722" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ===== Connection labels ===== -->
  <!-- A→B: 相似性 -->
  <rect x="603" y="212" width="76" height="24" rx="3" fill="#fffdf7" opacity="0.85"/>
  <text x="641" y="231" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#282722" transform="rotate(-16,641,231)">相似性</text>
  <!-- A→C: 因果关系 -->
  <rect x="594" y="396" width="94" height="24" rx="3" fill="#fffdf7" opacity="0.85"/>
  <text x="641" y="415" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#282722" transform="rotate(18,641,415)">因果关系</text>
  <!-- A→D: 时空相接 -->
  <rect x="255" y="248" width="94" height="24" rx="3" fill="#fffdf7" opacity="0.85"/>
  <text x="302" y="267" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#282722" transform="rotate(19,302,267)">时空相接</text>

  <!-- ===== Nodes ===== -->
  <!-- Center: 概念A (larger, bolder) -->
  <circle cx="420" cy="315" r="58" fill="#fffdf7" stroke="#282722" stroke-width="2.8"/>
  <text x="420" y="322" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#282722">概念A</text>

  <!-- 概念B — upper-right -->
  <circle cx="838" cy="172" r="44" fill="#fffdf7" stroke="#282722" stroke-width="2"/>
  <text x="838" y="179" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#282722">概念B</text>

  <!-- 概念C — lower-right -->
  <circle cx="838" cy="468" r="44" fill="#fffdf7" stroke="#282722" stroke-width="2"/>
  <text x="838" y="475" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#282722">概念C</text>

  <!-- 概念D — upper-left -->
  <circle cx="178" cy="215" r="44" fill="#fffdf7" stroke="#282722" stroke-width="2"/>
  <text x="178" y="222" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#282722">概念D</text>

  <!-- Small activation dots along connections -->
  <circle cx="530" cy="275" r="3" fill="#e4b936" opacity="0.5"/>
  <circle cx="590" cy="255" r="2.5" fill="#e4b936" opacity="0.4"/>
  <circle cx="710" cy="210" r="2" fill="#e4b936" opacity="0.35"/>
  <circle cx="530" cy="355" r="3" fill="#e4b936" opacity="0.5"/>
  <circle cx="600" cy="380" r="2.5" fill="#e4b936" opacity="0.4"/>
  <circle cx="710" cy="420" r="2" fill="#e4b936" opacity="0.35"/>
  <circle cx="350" cy="285" r="3" fill="#e4b936" opacity="0.5"/>
  <circle cx="290" cy="260" r="2.5" fill="#e4b936" opacity="0.4"/>

  <!-- ===== Red annotation ===== -->
  <path d="M640,568 Q625,565 612,558" fill="none" stroke="#ad4e3e" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M612,558 L618,552 M612,558 L619,564" fill="none" stroke="#ad4e3e" stroke-width="1.6" stroke-linecap="round"/>
  <text x="652" y="573" font-family="sans-serif" font-size="21" fill="#ad4e3e" font-style="italic" transform="rotate(-1.5,652,573)">一个概念激活一片网络</text>
</svg>
