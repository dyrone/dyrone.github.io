<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>替代机制与情感启发式——用简单问题偷换难问题</title>
  <desc>展示系统一如何将复杂的目标问题悄悄替换为一个更容易回答的启发式问题，以及两组替代实例</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M0,0.8 L9,3.5 L0,6.2" fill="none" stroke="#282722" stroke-width="1.1"/>
    </marker>
    <marker id="arw-r" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,1 L8,3.5 L0,6" fill="none" stroke="#8a8878" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="#fffdf7"/>
  <line x1="72" y1="0" x2="72" y2="630" stroke="#c4a088" stroke-width="1" opacity="0.22"/>
  <line x1="0" y1="76" x2="1200" y2="76" stroke="#d4cfc2" stroke-width="0.7" opacity="0.3"/>

  <!-- Chapter title -->
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#282722" letter-spacing="3">第七章 · 替代与情感启发式</text>

  <!-- ========== LEFT: Complex question ========== -->
  <!-- Yellow highlight block behind the big question mark -->
  <rect x="118" y="115" width="250" height="220" rx="6" fill="#efd15b" opacity="0.25"/>

  <!-- Complexity scribbles around the big ? -->
  <path d="M132,135 Q140,128 148,136" fill="none" stroke="#282722" stroke-width="1" opacity="0.25"/>
  <path d="M340,130 Q348,122 356,130" fill="none" stroke="#282722" stroke-width="1" opacity="0.25"/>
  <path d="M130,310 Q138,318 146,310" fill="none" stroke="#282722" stroke-width="1" opacity="0.25"/>
  <path d="M344,315 Q352,322 360,315" fill="none" stroke="#282722" stroke-width="1" opacity="0.25"/>
  <line x1="138" y1="200" x2="148" y2="195" stroke="#282722" stroke-width="0.8" opacity="0.2"/>
  <line x1="340" y1="250" x2="352" y2="244" stroke="#282722" stroke-width="0.8" opacity="0.2"/>

  <!-- Big question mark -->
  <text x="243" y="300" text-anchor="middle" font-family="sans-serif" font-size="150" font-weight="bold" fill="#282722" opacity="0.88">?</text>

  <!-- "难问题" label -->
  <text x="243" y="365" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#282722">难问题</text>
  <text x="243" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a8878">（复杂、需要深思）</text>

  <!-- ========== CENTER: Substitution arrow ========== -->
  <line x1="400" y1="240" x2="590" y2="240" stroke="#282722" stroke-width="2.5" marker-end="url(#arw)"/>
  <!-- Yellow highlight on the arrow -->
  <line x1="405" y1="240" x2="585" y2="240" stroke="#efd15b" stroke-width="10" opacity="0.3"/>
  <text x="497" y="222" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#282722">替 代</text>
  <text x="497" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a8878">（无意识切换）</text>

  <!-- ========== RIGHT: Simple question ========== -->
  <text x="780" y="280" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="bold" fill="#282722" opacity="0.75">?</text>

  <!-- "简单问题" label -->
  <text x="780" y="340" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#282722">简单问题</text>
  <text x="780" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a8878">（直觉可答）</text>

  <!-- ========== BOTTOM: Substitution examples table ========== -->
  <!-- Table border -->
  <rect x="108" y="418" width="960" height="140" rx="4" fill="none" stroke="#282722" stroke-width="1.5" opacity="0.5"/>
  <!-- Header separator -->
  <line x1="108" y1="456" x2="1068" y2="456" stroke="#282722" stroke-width="1" opacity="0.4"/>
  <!-- Row separator -->
  <line x1="108" y1="492" x2="1068" y2="492" stroke="#282722" stroke-width="0.5" opacity="0.25"/>

  <!-- Header row -->
  <text x="330" y="443" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#282722">实际问题（难）</text>
  <text x="588" y="443" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#8a8878">→</text>
  <text x="840" y="443" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#282722">替代问题（简单）</text>

  <!-- Row 1 -->
  <text x="330" y="479" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#282722">你幸福吗？</text>
  <line x1="508" y1="475" x2="560" y2="475" stroke="#8a8878" stroke-width="1.2" marker-end="url(#arw-r)"/>
  <text x="840" y="479" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#282722">你最近心情好吗？</text>

  <!-- Row 2 -->
  <text x="330" y="532" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#282722">该候选人能胜任吗？</text>
  <line x1="508" y1="528" x2="560" y2="528" stroke="#8a8878" stroke-width="1.2" marker-end="url(#arw-r)"/>
  <text x="840" y="532" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#282722">他长得像领导吗？</text>

  <!-- ========== Red annotation ========== -->
  <text x="920" y="598" text-anchor="end" font-family="sans-serif" font-size="21" fill="#ad4e3e" font-style="italic" transform="rotate(-1.5,920,598)">答非所问而不自知</text>
  <path d="M932,594 Q945,590 958,595" fill="none" stroke="#ad4e3e" stroke-width="1.5" stroke-linecap="round"/>
</svg>
