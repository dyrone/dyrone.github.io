<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>外部意见与参考类别预测——跳出个案看基准率</title>
  <desc>左侧放大镜聚焦单一项目计划（内部意见），右侧柱状分布图展示同类项目的真实结果（外部意见），提示先看基准率再谈个案</desc>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="#fffdf7"/>
  <line x1="72" y1="0" x2="72" y2="630" stroke="#c4a088" stroke-width="1" opacity="0.22"/>
  <line x1="0" y1="76" x2="1200" y2="76" stroke="#d4cfc2" stroke-width="0.7" opacity="0.3"/>

  <!-- Chapter title -->
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#282722" letter-spacing="3">第九章 · 外部意见与参考类别预测</text>

  <!-- ========== Central divider ========== -->
  <line x1="580" y1="95" x2="580" y2="490" stroke="#282722" stroke-width="1" stroke-dasharray="6 5" opacity="0.25"/>
  <text x="580" y="520" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#282722" opacity="0.4">VS</text>

  <!-- ========== LEFT PANEL: Magnifying glass + project plan ========== -->
  <!-- Magnifying glass -->
  <circle cx="275" cy="280" r="110" fill="#fffdf7" stroke="#282722" stroke-width="3"/>
  <!-- Glass glint -->
  <path d="M210,210 Q220,200 235,205" fill="none" stroke="#282722" stroke-width="1.5" opacity="0.2"/>
  <!-- Handle -->
  <line x1="353" y1="358" x2="420" y2="425" stroke="#282722" stroke-width="10" stroke-linecap="round"/>
  <line x1="353" y1="358" x2="420" y2="425" stroke="#8a8878" stroke-width="6" stroke-linecap="round"/>

  <!-- Inside the magnifying glass: a single project plan -->
  <!-- Document shape -->
  <rect x="225" y="220" width="100" height="120" rx="3" fill="none" stroke="#282722" stroke-width="1.5"/>
  <!-- Document fold corner -->
  <path d="M305,220 L305,235 L325,235" fill="#fffdf7" stroke="#282722" stroke-width="1"/>
  <!-- Text lines inside document -->
  <line x1="238" y1="245" x2="310" y2="245" stroke="#282722" stroke-width="1.2" opacity="0.5"/>
  <line x1="238" y1="258" x2="300" y2="258" stroke="#282722" stroke-width="1.2" opacity="0.5"/>
  <!-- Timeline bar (optimistic) -->
  <rect x="238" y="275" width="60" height="8" rx="2" fill="#efd15b" opacity="0.6" stroke="#282722" stroke-width="0.8"/>
  <text x="250" y="300" font-family="sans-serif" font-size="9" fill="#282722" opacity="0.7">12个月</text>
  <!-- Checkmarks -->
  <text x="238" y="320" font-family="sans-serif" font-size="10" fill="#282722" opacity="0.5">&#10003; 按时完成</text>
  <text x="238" y="333" font-family="sans-serif" font-size="10" fill="#282722" opacity="0.5">&#10003; 预算可控</text>

  <!-- Left panel label -->
  <text x="275" y="470" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#282722">内部意见</text>
  <text x="275" y="494" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#8a8878">（本案推演）</text>

  <!-- ========== RIGHT PANEL: Histogram distribution ========== -->
  <!-- Y-axis -->
  <line x1="660" y1="130" x2="660" y2="420" stroke="#282722" stroke-width="1.5"/>
  <!-- X-axis -->
  <line x1="660" y1="420" x2="1120" y2="420" stroke="#282722" stroke-width="1.5"/>
  <!-- Y-axis label -->
  <text x="640" y="130" text-anchor="end" font-family="sans-serif" font-size="12" fill="#8a8878">项目数</text>
  <!-- X-axis label -->
  <text x="1120" y="440" text-anchor="end" font-family="sans-serif" font-size="12" fill="#8a8878">实际完成月数</text>

  <!-- Histogram bars (right-skewed distribution) -->
  <!-- 6月 -->
  <rect x="685" y="388" width="42" height="32" fill="#282722" opacity="0.15"/>
  <text x="706" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8878">6</text>
  <!-- 12月 -->
  <rect x="740" y="348" width="42" height="72" fill="#282722" opacity="0.2"/>
  <text x="761" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8878">12</text>
  <!-- 18月 (tallest — mode) -->
  <rect x="795" y="210" width="42" height="210" fill="#282722" opacity="0.3"/>
  <text x="816" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8878">18</text>
  <!-- 24月 -->
  <rect x="850" y="260" width="42" height="160" fill="#282722" opacity="0.25"/>
  <text x="871" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8878">24</text>
  <!-- 30月 -->
  <rect x="905" y="330" width="42" height="90" fill="#282722" opacity="0.2"/>
  <text x="926" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8878">30</text>
  <!-- 36月 -->
  <rect x="960" y="370" width="42" height="50" fill="#282722" opacity="0.15"/>
  <text x="981" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8878">36</text>
  <!-- >36月 -->
  <rect x="1015" y="390" width="42" height="30" fill="#282722" opacity="0.12"/>
  <text x="1036" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8878">>36</text>

  <!-- "你的预测" marker at 12月 bar — showing optimistic bias -->
  <line x1="761" y1="145" x2="761" y2="340" stroke="#e4b936" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="755,340 761,352 767,340" fill="#e4b936"/>
  <text x="761" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e4b936">你的预测</text>

  <!-- "基准率" bracket pointing to the peak area -->
  <path d="M795,195 L816,185 L850,195" fill="none" stroke="#282722" stroke-width="1.2" opacity="0.5"/>
  <text x="822" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#282722" opacity="0.6">基准率峰值</text>

  <!-- Right panel label -->
  <text x="890" y="470" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#282722">外部意见</text>
  <text x="890" y="494" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#8a8878">（参考类别）</text>

  <!-- ========== Red annotation ========== -->
  <path d="M580,572 Q565,568 552,565" fill="none" stroke="#ad4e3e" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M552,565 L558,558 M552,565 L559,571" fill="none" stroke="#ad4e3e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="590" y="577" font-family="sans-serif" font-size="21" fill="#ad4e3e" font-style="italic" transform="rotate(-1.5,590,577)">先看基准率，再谈个案</text>
</svg>
